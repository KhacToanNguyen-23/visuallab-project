server.port=8080
spring.application.name=edulab-backend

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database Connection (Default PostgreSQL localhost:5432/edulab)
spring.datasource.url=jdbc:postgresql://localhost:5432/edulab
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Fallback in case PostgreSQL is not available locally
spring.datasource.continue-on-error=true
