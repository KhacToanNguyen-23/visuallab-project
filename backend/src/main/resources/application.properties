server.port=8080
spring.application.name=edulab-backend

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database Connection (Default PostgreSQL localhost:5432/edulab)
spring.datasource.url=jdbc:postgresql://localhost:5432/edulab
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Fallback in case PostgreSQL is not available locally
spring.datasource.continue-on-error=true

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:EduLabPhysicsSecretKeyForJwtTokenGeneration2026}

