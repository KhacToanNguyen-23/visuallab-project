server.port=8080
spring.application.name=edulab-backend

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.hbm2ddl.auto=update
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# Database Connection (PostgreSQL localhost:5432/edulab)
spring.datasource.url=jdbc:postgresql://localhost:5432/edulab
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:EduLabPhysicsSecretKeyForJwtTokenGeneration2026}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# Email Delivery Configuration (mode: mock | resend | smtp)
email.mode=smtp
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:EduLab <onboarding@resend.dev>}

# Gmail SMTP Configuration (when email.mode=smtp)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:edulabs2e@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:gixjwiucrbbwughk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend URL Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

