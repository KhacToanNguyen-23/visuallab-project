server.port=8080
spring.application.name=edulab-backend

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.hbm2ddl.auto=update
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# Database Connection (PostgreSQL localhost:5432/edulab)
spring.datasource.url=jdbc:postgresql://localhost:5432/edulab
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:EduLabPhysicsSecretKeyForJwtTokenGeneration2026}

